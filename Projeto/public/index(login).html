<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Clube T21</title>
    <link href="./css/css_site/style(login).css" rel="stylesheet">
</head>

<body>
    <header class="barra">
        <div class="header-content">
            <div class="logo">
                <img src="./assets/assets_site/imgs/logo.jpg" alt="Logo Clube T21">
                <div class="logo-text">
                    <strong>Clube T21</strong>
                    <span>Esporte Inclusivo</span>
                </div>
            </div>
            <nav class="nav-principal">
                <div class="nav-right">
                    <a href="index(site).html" class="btn-voltar">Volte a Tela Inicial</a>
                </div>

        </div>
    </header>

    <main class="login-main">
        <div class="login-box">
            <div class="login-header">
                <h1>Acesse sua <span>Conta</span></h1>
                <p>Faça login para acessar sua área exclusiva</p>
            </div>

            <form>
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" placeholder="Ex: nome@email.com" required>
                </div>

                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" placeholder="Sua senha" required>
                </div>

                 <button type="sub" class="btn-entrar" onclick="Registrar()">Entrar</button>
            </form>

            <p class="create-account">Ainda não faz parte? <a href="index(cadastro).html">Inscreva-se agora</a></p>
        </div>
    </main>
</body>

</html>
